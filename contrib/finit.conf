# Services to be monitored and respawned as needed

# klogd and syslogd are placed in the maint cgroup.  There is no
# "current cgroup" to switch in this format, every block names its own.
service klogd {
	description = "Kernel logging server"
	runlevel    = "2345"
	conditions  = { "pid/syslogd" }
	cgroup maint {}
	command     = "klogd -n"
}
service syslogd {
	description = "Syslog server"
	runlevel    = "2345"
	cgroup maint {}
	command     = "syslogd -n"
}

# gdm gets its own limits inside the system group, which is where
# services end up when no cgroup block is given.
service gdm {
	description = "GNOME Display Manager"
	runlevel    = "3"
	cgroup system {
		cpu.weight = 250
		memory.max = 10M
	}
	command     = "gdm"
}

# Start SSH daemon with opts from /etc/default/ssh (if available), move
# to user cgroup with cpu.weight 250.  Default weight in the user group
# is 100 (above).
service sshd {
	description = "OpenSSH daemon"
	runlevel    = "2345"
	envfile     = "-/etc/default/ssh"
	cgroup user {
		cpu.weight = 250
		memory.max = 10M
	}
	command     = "/usr/sbin/sshd -D $SSHD_OPTS"
}

# The BusyBox ntpd does not use syslog when running in the foreground
# So we use this trick to redirect stdout/stderr to a log file.  The
# log file is rotated with the above settings.  The condition declares
# a dependency on a system default route (gateway) to be set.  ntpd
# does not respect SIGHUP, so Finit restarts it on reload instead.
service ntpd {
	description   = "NTP daemon"
	runlevel      = "2345"
	conditions    = { "net/route/default" }
	reload-signal = "none"
	log { file = "/var/log/ntpd.log" }
	command       = "ntpd -n -l -I eth0"
}

# Run start scripts from this directory
#runparts = "/etc/start.d"

# For multiple instances of the same service, add :ID to the block title.
service httpd:80 {
	description = "Web server"
	runlevel    = "2345"
	command     = "/sbin/httpd -f -h /http -p 80"
}
service httpd:8080 {
	description = "Old web server"
	runlevel    = "2345"
	command     = "/sbin/httpd -f -h /http -p 8080"
}
