# Consoles to start getty on when system is up
tty tty1 {
	runlevel = "12345"
	device   = "/dev/tty1"
	term     = "linux"
	noclear  = true
	nowait   = true
}
tty tty2 {
	runlevel = "2345"
	device   = "/dev/tty2"
	term     = "linux"
	nowait   = true
}
tty tty3 {
	runlevel = "2345"
	device   = "/dev/tty3"
	term     = "linux"
	nowait   = true
}
