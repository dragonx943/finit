<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  The system bus configuration for the test namespace, deliberately
  permissive.  It lives where a stock system bus daemon looks for its
  configuration, so the dbus plugin's own invocation finds it.

  What is under test is Finit attaching to a broker and serving calls
  routed through it, not dbus policy, so nothing here should be able
  to refuse a message and make a Finit bug look like a policy denial.
  Everything runs as root inside the namespace, hence no <user>.
-->
<busconfig>
  <type>system</type>

  <!-- Pick up the policy Finit itself ships, so a malformed
       org.finit.conf fails the test rather than a target. -->
  <includedir>/etc/dbus-1/system.d</includedir>
  <listen>unix:path=/var/run/dbus/system_bus_socket</listen>
  <auth>EXTERNAL</auth>

  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_type="method_call"/>
    <allow send_type="signal"/>
    <allow send_type="method_return"/>
    <allow send_type="error"/>
    <allow receive_type="method_call"/>
    <allow receive_type="signal"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
  </policy>
</busconfig>
