# sample.conf: template run/task/service stanza for finit
#
# A .conf file is a series of blocks.  Every setting is a key inside
# one, so nothing has to be memorised by position:
#
#   service NAME {
#       description = "What it is"
#       runlevel    = "2345"           # default: 234
#       conditions  = { "net/lo/up" }  # wait for these
#       envfile     = "-/etc/default/daemon"
#       command     = "/usr/sbin/daemon ARGS"
#   }
#
# A leading '-' on a path means carry on if it is missing, so the
# envfile above is optional.  Debian and Buildroot keep those files in
# /etc/default, Alpine in /etc/conf.d.
#
# There are four kinds of stanza:
#
# - run     : one-shot, wait for it before continuing with the next
# - task    : one-shot, started in parallel with the next
# - service : supervised daemon, run in foreground, restarted if it crashes
# - sysv    : /etc/init.d style script, start/stop/restart
#
# The top-level cgroups can be defined anywhere, but share the same
# namespace.  It is up to the user to ensure groups are defined only
# once, otherwise the last read .conf wins:
#
#   cgroup NAME {
#       cpu.weight = 1000
#       memory.max = 65M
#   }
#
# A service joins one by naming it, and may override settings for
# itself alone.  Here foo and bar share the group foo, baz has its own:
#
#   service foo { cgroup foo {}                   command = "foo args" }
#   service bar { cgroup foo { cpu.weight = 150 } command = "bar args" }
#   service baz { cgroup baz { cpu.weight = 300 } command = "baz args" }

